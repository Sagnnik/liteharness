name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Compile
        run: uv run python -m compileall -q .
        env:
          OPENAI_API_KEY: test

      - name: Run pytest
        run: uv run pytest -q
        env:
          OPENAI_API_KEY: test
