<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="LiteHarness CLI slash command menu concept">
  <defs>
    <linearGradient id="screen-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="72%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#0d1018"/>
    </linearGradient>
    <linearGradient id="context-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a8f97"/>
      <stop offset="100%" stop-color="#39c5cf"/>
    </linearGradient>
    <pattern id="transcript-fade" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0b0e14"/>
      <circle cx="1" cy="1" r="0.35" fill="#12161f" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="960" height="440" rx="10" fill="url(#screen-bg)"/>
  <rect x="1" y="1" width="958" height="438" rx="9" fill="none" stroke="#1e222a" stroke-width="1"/>

  <!-- transcript -->
  <rect x="24" y="24" width="912" height="200" rx="6" fill="url(#transcript-fade)" opacity="0.35"/>
  <text x="40" y="48" font-family="monospace" font-size="11" fill="#5c626d" font-style="italic">I should check the command list before suggesting next steps...</text>
  <text x="40" y="64" font-family="monospace" font-size="11" fill="#5c626d" font-style="italic">Let me read the commands module to see what slash commands exist.</text>
  <rect x="40" y="76" width="420" height="20" rx="4" fill="#1a2e1a" stroke="#2d4a2d" stroke-width="0.5"/>
  <text x="52" y="90" font-family="monospace" font-size="11" fill="#3fb950">read ~/projects/liteharness/cli/commands.py</text>
  <text x="40" y="114" font-family="monospace" font-size="11" fill="#5c626d">Tool results loaded. Ready for user input.</text>
  <line x1="40" y1="136" x2="360" y2="136" stroke="#1e222a" stroke-width="1"/>
  <line x1="40" y1="156" x2="520" y2="156" stroke="#1e222a" stroke-width="1"/>
  <line x1="40" y1="176" x2="420" y2="176" stroke="#1e222a" stroke-width="1"/>
  <line x1="40" y1="196" x2="280" y2="196" stroke="#1e222a" stroke-width="1"/>

  <!-- input zone: purple rules -->
  <line x1="24" y1="238" x2="936" y2="238" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="24" y1="270" x2="936" y2="270" stroke="#a78bfa" stroke-width="1.5"/>

  <text x="44" y="260" font-family="monospace" font-size="15" font-weight="700" fill="#3fb950">act</text>
  <text x="84" y="260" font-family="monospace" font-size="15" font-weight="700" fill="#39c5cf">&gt;</text>
  <text x="104" y="260" font-family="monospace" font-size="15" fill="#c4c9d4">/</text>
  <rect x="116" y="246" width="8" height="18" rx="1" fill="#c4c9d4"/>

  <!-- slash command dropdown -->
  <g font-family="monospace" font-size="12">
    <rect x="24" y="274" width="912" height="18" fill="#1f3a63"/>
    <text x="44" y="287" fill="#39c5cf">-&gt;</text>
    <text x="72" y="287" fill="#c4c9d4" font-weight="700">help</text>
    <text x="280" y="287" fill="#8a909c">Show the command reference</text>

    <text x="72" y="305" fill="#8a909c">config</text>
    <text x="280" y="305" fill="#5c626d">Set API keys, switch model, toggle options</text>

    <text x="72" y="323" fill="#8a909c">menu</text>
    <text x="280" y="323" fill="#5c626d">Open this command menu</text>

    <text x="72" y="341" fill="#8a909c">cost</text>
    <text x="280" y="341" fill="#5c626d">Show token and cost totals</text>

    <text x="72" y="359" fill="#8a909c">compact</text>
    <text x="280" y="359" fill="#5c626d">Force compaction on the next turn</text>

    <text x="72" y="377" fill="#8a909c">skills</text>
    <text x="280" y="377" fill="#5c626d">List loaded skills and warnings</text>
  </g>

  <!-- stats row -->
  <g font-family="monospace" font-size="12">
    <text x="44" y="404" fill="#5c626d">&#8593;</text>
    <text x="56" y="404" fill="#8a909c">1,284</text>
    <text x="108" y="404" fill="#5c626d">&#8595;</text>
    <text x="120" y="404" fill="#8a909c">512</text>
    <text x="168" y="404" fill="#8a909c">$0.0042</text>

    <g>
      <rect x="836" y="394" width="100" height="6" rx="3" fill="#12161f" stroke="#1e222a" stroke-width="0.5"/>
      <rect x="836" y="394" width="49" height="6" rx="3" fill="url(#context-fill)"/>
      <text x="820" y="404" text-anchor="end">
        <tspan fill="#5c626d">context </tspan>
        <tspan fill="#8a909c">63k/128k used</tspan>
      </text>
    </g>
  </g>

  <text x="44" y="424" font-family="monospace" font-size="11" fill="#8a909c">~/projects/liteharness (main)</text>
  <text x="936" y="424" font-family="monospace" font-size="11" fill="#8a909c" text-anchor="end">deepseek-v4-flash &#8226; xhigh</text>
</svg>
