<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="540" viewBox="0 0 1800 540" role="img" aria-label="LiteHarness">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f5a96"/>
      <stop offset="100%" stop-color="#1f3a63"/>
    </linearGradient>
    <pattern id="diagonal" width="27" height="27" patternUnits="userSpaceOnUse" patternTransform="rotate(-32)">
      <line x1="0" y1="0" x2="0" y2="27" stroke="#b8c9dc" stroke-width="0.98"/>
    </pattern>
  </defs>

  <rect width="1800" height="540" fill="url(#bg)"/>
  <rect width="1800" height="540" fill="url(#diagonal)"/>

  <!-- geometric accents (right side) -->
  <g fill="none" stroke="#2f5a96" opacity="0.55">
    <circle cx="1530" cy="270" r="252" stroke-width="1.5"/>
    <circle cx="1530" cy="270" r="168" stroke-width="1.13"/>
    <circle cx="1530" cy="270" r="84" stroke-width="1.13"/>
    <line x1="960" y1="-30" x2="1860" y2="570" stroke-width="0.9"/>
    <line x1="1140" y1="-30" x2="1800" y2="450" stroke-width="0.9"/>
  </g>

  <rect x="0" y="531" width="1800" height="9" fill="url(#accent)" opacity="0.75"/>

  <!-- loop mark -->
  <g transform="translate(240, 270) scale(1.25) translate(-132, -132)">
    <circle cx="132" cy="132" r="114" fill="none" stroke="#b8c9dc" stroke-width="2.25"/>
    <path
      d="M 132 42 A 90 90 0 1 1 131.7 42"
      fill="none"
      stroke="#0b0e14"
      stroke-width="6"
      stroke-linecap="round"
    />
    <circle cx="132" cy="42" r="10.5" fill="#2a8f97"/>
    <circle cx="210" cy="177" r="8.25" fill="#5c626d"/>
    <circle cx="54" cy="177" r="8.25" fill="#5c626d"/>
    <line x1="132" y1="52.5" x2="201" y2="168" stroke="#1f3a63" stroke-width="3" opacity="0.4"/>
    <line x1="132" y1="52.5" x2="63" y2="168" stroke="#1f3a63" stroke-width="3" opacity="0.4"/>
  </g>

  <line x1="429" y1="120" x2="429" y2="420" stroke="#b8c9dc" stroke-width="3"/>

  <text
    x="477"
    y="267"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="78"
    font-weight="600"
    letter-spacing="-0.75"
  >
    <tspan fill="#2f5a96">Lite</tspan><tspan fill="#0b0e14">Harness</tspan>
  </text>

  <text
    x="480"
    y="321"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="27"
    font-weight="400"
    fill="#5c626d"
  >
    Hackable coding-agent harness
  </text>
</svg>
