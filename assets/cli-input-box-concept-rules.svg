<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="LiteHarness CLI input box concept (ruled variant)">
  <defs>
    <linearGradient id="screen-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="72%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#0d1018"/>
    </linearGradient>
    <linearGradient id="context-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a8f97"/>
      <stop offset="100%" stop-color="#39c5cf"/>
    </linearGradient>
    <pattern id="transcript-fade" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0b0e14"/>
      <circle cx="1" cy="1" r="0.35" fill="#12161f" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="960" height="320" rx="10" fill="url(#screen-bg)"/>
  <rect x="1" y="1" width="958" height="318" rx="9" fill="none" stroke="#1e222a" stroke-width="1"/>

  <rect x="24" y="24" width="912" height="132" rx="6" fill="url(#transcript-fade)" opacity="0.35"/>
  <text x="40" y="52" font-family="monospace" font-size="11" fill="#5c626d">transcript scrolls above</text>
  <line x1="40" y1="72" x2="320" y2="72" stroke="#1e222a" stroke-width="1"/>
  <line x1="40" y1="92" x2="520" y2="92" stroke="#1e222a" stroke-width="1"/>
  <line x1="40" y1="112" x2="420" y2="112" stroke="#1e222a" stroke-width="1"/>
  <line x1="40" y1="132" x2="280" y2="132" stroke="#1e222a" stroke-width="1"/>

  <line x1="24" y1="176" x2="936" y2="176" stroke="#1e222a" stroke-width="1"/>

  <!-- input zone: two purple rules instead of filled box -->
  <line x1="24" y1="200" x2="936" y2="200" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="24" y1="240" x2="936" y2="240" stroke="#a78bfa" stroke-width="1.5"/>

  <text x="44" y="228" font-family="monospace" font-size="15" font-weight="700" fill="#3fb950">act</text>
  <text x="84" y="228" font-family="monospace" font-size="15" font-weight="700" fill="#39c5cf">&gt;</text>
  <text x="104" y="228" font-family="monospace" font-size="15" fill="#c4c9d4">refactor the auth module to use JWT</text>
  <rect x="392" y="212" width="2" height="20" rx="1" fill="#39c5cf"/>

  <g font-family="monospace" font-size="12">
    <text x="44" y="268" fill="#5c626d">&#8593;</text>
    <text x="56" y="268" fill="#8a909c">1,284</text>
    <text x="108" y="268" fill="#5c626d">&#8595;</text>
    <text x="120" y="268" fill="#8a909c">512</text>
    <text x="168" y="268" fill="#8a909c">$0.0042</text>

    <g>
      <rect x="836" y="258" width="100" height="6" rx="3" fill="#12161f" stroke="#1e222a" stroke-width="0.5"/>
      <rect x="836" y="258" width="49" height="6" rx="3" fill="url(#context-fill)"/>
      <text x="820" y="268" text-anchor="end">
        <tspan fill="#5c626d">context </tspan>
        <tspan fill="#8a909c">63k/128k used</tspan>
      </text>
    </g>
  </g>

  <text x="44" y="288" font-family="monospace" font-size="11" fill="#8a909c">~/projects/liteharness (main)</text>
  <text x="936" y="288" font-family="monospace" font-size="11" fill="#8a909c" text-anchor="end">deepseek-v4-flash &#8226; xhigh</text>
</svg>
