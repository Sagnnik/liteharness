<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="LiteHarness CLI config models picker concept">
  <defs>
    <linearGradient id="screen-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="72%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#0d1018"/>
    </linearGradient>
    <linearGradient id="context-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a8f97"/>
      <stop offset="100%" stop-color="#39c5cf"/>
    </linearGradient>
    <pattern id="transcript-fade" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0b0e14"/>
      <circle cx="1" cy="1" r="0.35" fill="#12161f" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="960" height="440" rx="10" fill="url(#screen-bg)"/>
  <rect x="1" y="1" width="958" height="438" rx="9" fill="none" stroke="#1e222a" stroke-width="1"/>

  <!-- transcript -->
  <rect x="24" y="24" width="912" height="200" rx="6" fill="url(#transcript-fade)" opacity="0.35"/>
  <text x="40" y="48" font-family="monospace" font-size="11" fill="#5c626d" font-style="italic">Opening config to switch the chat model...</text>
  <text x="40" y="64" font-family="monospace" font-size="11" fill="#5c626d">User selected /config, then models.</text>
  <rect x="40" y="76" width="280" height="20" rx="4" fill="#1a2e1a" stroke="#2d4a2d" stroke-width="0.5"/>
  <text x="52" y="90" font-family="monospace" font-size="11" fill="#3fb950">/config</text>
  <text x="40" y="114" font-family="monospace" font-size="11" fill="#5c626d">Config menu: Switch chat model</text>
  <line x1="40" y1="136" x2="360" y2="136" stroke="#1e222a" stroke-width="1"/>
  <line x1="40" y1="156" x2="520" y2="156" stroke="#1e222a" stroke-width="1"/>
  <line x1="40" y1="176" x2="420" y2="176" stroke="#1e222a" stroke-width="1"/>
  <line x1="40" y1="196" x2="280" y2="196" stroke="#1e222a" stroke-width="1"/>

  <!-- input zone: purple rules -->
  <line x1="24" y1="226" x2="936" y2="226" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="24" y1="254" x2="936" y2="254" stroke="#a78bfa" stroke-width="1.5"/>

  <text x="44" y="246" font-family="monospace" font-size="15" font-weight="700" fill="#3fb950">act</text>
  <text x="84" y="246" font-family="monospace" font-size="15" font-weight="700" fill="#39c5cf">&gt;</text>
  <text x="104" y="246" font-family="monospace" font-size="15" fill="#39c5cf">/config</text>

  <!-- header row -->
  <text x="44" y="270" font-family="monospace" font-size="10" fill="#39c5cf">/config &#8250; models &#8212; Select the chat model:</text>
  <text x="936" y="270" font-family="monospace" font-size="10" fill="#5c626d" text-anchor="end">&#8593;/&#8595; scroll</text>

  <!-- models picker (6 visible rows) -->
  <g font-family="monospace" font-size="12">
    <text x="72" y="288" fill="#8a909c">anthropic/claude-3-haiku</text>

    <text x="72" y="306" fill="#8a909c">google/gemini-2.0-flash</text>

    <text x="72" y="324" fill="#8a909c">deepseek/deepseek-chat</text>

    <rect x="24" y="329" width="912" height="18" fill="#1f3a63"/>
    <text x="44" y="342" fill="#39c5cf">-&gt;</text>
    <text x="72" y="342" fill="#c4c9d4" font-weight="700">deepseek/deepseek-v4-flash</text>
    <text x="340" y="342" fill="#39c5cf">(current)</text>

    <text x="72" y="360" fill="#8a909c">moonshotai/kimi-k2.6</text>

    <text x="72" y="378" fill="#8a909c">moonshotai/kimi-k2.7-code</text>
  </g>

  <!-- stats row -->
  <g font-family="monospace" font-size="12">
    <text x="44" y="404" fill="#5c626d">&#8593;</text>
    <text x="56" y="404" fill="#8a909c">1,284</text>
    <text x="108" y="404" fill="#5c626d">&#8595;</text>
    <text x="120" y="404" fill="#8a909c">512</text>
    <text x="168" y="404" fill="#8a909c">$0.0042</text>

    <g>
      <rect x="836" y="394" width="100" height="6" rx="3" fill="#12161f" stroke="#1e222a" stroke-width="0.5"/>
      <rect x="836" y="394" width="49" height="6" rx="3" fill="url(#context-fill)"/>
      <text x="820" y="404" text-anchor="end">
        <tspan fill="#5c626d">context </tspan>
        <tspan fill="#8a909c">63k/128k used</tspan>
      </text>
    </g>
  </g>

  <text x="44" y="424" font-family="monospace" font-size="11" fill="#8a909c">~/projects/liteharness (main)</text>
  <text x="936" y="424" font-family="monospace" font-size="11" fill="#8a909c" text-anchor="end">deepseek-v4-flash &#8226; xhigh</text>
</svg>
