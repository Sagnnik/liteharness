<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="Ness AI">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f4f2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4715b"/>
      <stop offset="100%" stop-color="#a65d47"/>
    </linearGradient>
    <pattern id="diagonal" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-32)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#ebe5df" stroke-width="0.65"/>
    </pattern>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#diagonal)"/>

  <!-- geometric accents -->
  <g fill="none" stroke="#e6dfd8" opacity="0.85">
    <circle cx="600" cy="520" r="280" stroke-width="1"/>
    <circle cx="600" cy="520" r="196" stroke-width="0.75"/>
    <circle cx="600" cy="520" r="112" stroke-width="0.75"/>
    <line x1="120" y1="80" x2="1080" y2="1120" stroke-width="0.6"/>
    <line x1="280" y1="40" x2="1120" y2="920" stroke-width="0.6"/>
    <line x1="80" y1="920" x2="1120" y2="280" stroke-width="0.6"/>
  </g>

  <rect x="0" y="1192" width="1200" height="8" fill="url(#accent)" opacity="0.55"/>

  <!-- loop mark -->
  <g transform="translate(512, 344)">
    <circle cx="88" cy="88" r="76" fill="none" stroke="#ebe5df" stroke-width="1.5"/>
    <path
      d="M 88 28 A 60 60 0 1 1 87.8 28"
      fill="none"
      stroke="#1a1a1a"
      stroke-width="4"
      stroke-linecap="round"
    />
    <circle cx="88" cy="28" r="7" fill="#c4715b"/>
    <circle cx="140" cy="118" r="5.5" fill="#9b8b82"/>
    <circle cx="36" cy="118" r="5.5" fill="#9b8b82"/>
    <line x1="88" y1="35" x2="134" y2="112" stroke="#6b5e57" stroke-width="2" opacity="0.35"/>
    <line x1="88" y1="35" x2="42" y2="112" stroke="#6b5e57" stroke-width="2" opacity="0.35"/>
  </g>

  <text
    x="600"
    y="620"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="72"
    font-weight="600"
    letter-spacing="-0.5"
  >
    <tspan fill="#c4715b">Ness</tspan><tspan fill="#1a1a1a"> AI</tspan>
  </text>

  <text
    x="600"
    y="680"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="26"
    font-weight="400"
    fill="#6b5e57"
  >
    Own the Loop
  </text>
</svg>
