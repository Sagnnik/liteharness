<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="LiteHarness CLI header dashboard concept">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#0d1018"/>
    </linearGradient>
    <linearGradient id="loop-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39c5cf"/> <!-- cyan -->
      <stop offset="50%" stop-color="#3b82f6"/> <!-- blue -->
      <stop offset="100%" stop-color="#a78bfa"/> <!-- purple -->
    </linearGradient>
  </defs>

  <rect width="960" height="300" rx="10" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="298" rx="9" fill="none" stroke="#1e222a" stroke-width="1"/>

  <!-- Left: Loop Logo -->
  <g transform="translate(30, 45) scale(0.7)">
    <!-- base circle -->
    <circle cx="88" cy="88" r="76" fill="none" stroke="#1e222a" stroke-width="1.5"/>
    <!-- active loop path -->
    <path
      d="M 88 28 A 60 60 0 1 1 87.8 28"
      fill="none"
      stroke="url(#loop-gradient)"
      stroke-width="5"
      stroke-linecap="round"
    />
    <!-- inner node connections -->
    <line x1="88" y1="35" x2="134" y2="112" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
    <line x1="88" y1="35" x2="42" y2="112" stroke="#39c5cf" stroke-width="2" opacity="0.6"/>
    <line x1="134" y1="112" x2="42" y2="112" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <!-- nodes -->
    <circle cx="88" cy="28" r="7" fill="#39c5cf"/>  <!-- cyan -->
    <circle cx="140" cy="118" r="6" fill="#a78bfa"/> <!-- purple -->
    <circle cx="36" cy="118" r="6" fill="#fbbf24"/>  <!-- amber -->
  </g>

  <!-- Title -->
  <text x="180" y="64" font-family="monospace" font-size="22" font-weight="800" fill="#c4c9d4">Lite</text>
  <text x="235" y="64" font-family="monospace" font-size="22" font-weight="800" fill="url(#loop-gradient)">Harness</text>
  <text x="330" y="60" font-family="monospace" font-size="12" fill="#5c626d">v0.1.0</text>

  <!-- Dashboard Stats Grid -->
  <rect x="180" y="80" width="740" height="56" rx="6" fill="#12161f" stroke="#1e222a" stroke-width="1"/>
  
  <g font-family="monospace" font-size="12">
    <!-- Row 1 -->
    <text x="200" y="102" fill="#8a909c">Session :</text>
    <text x="280" y="102" fill="#c4c9d4">deepseek-v4-flash</text>
    
    <text x="490" y="102" fill="#8a909c">Project :</text>
    <text x="570" y="102" fill="#c4c9d4">~/projects/liteharness</text>

    <!-- Divider -->
    <line x1="470" y1="90" x2="470" y2="126" stroke="#1e222a" stroke-width="1"/>

    <!-- Row 2 -->
    <text x="200" y="124" fill="#8a909c">Mode    :</text>
    <text x="280" y="124" fill="#c4c9d4">Act (auto-approval)</text>
    
    <text x="490" y="124" fill="#8a909c">Add-ons :</text>
    <text x="570" y="124" fill="#c4c9d4">2 MCPs (echo, fs), 3 Skills</text>

    <!-- Status indicator (Online dot) -->
    <circle cx="850" cy="108" r="4" fill="#3fb950"/>
    <text x="860" y="112" fill="#3fb950" font-weight="700">Ready</text>
  </g>

  <!-- Hints Section -->
  <g font-family="monospace" font-size="12">
    <text x="180" y="164" fill="#5c626d">Hints:</text>
    <text x="240" y="164" fill="#8a909c"><tspan fill="#c4c9d4">↑/↓</tspan> select · <tspan fill="#c4c9d4">Enter</tspan> run · <tspan fill="#c4c9d4">Tab</tspan> complete · <tspan fill="#c4c9d4">Shift+Tab</tspan> toggle Act/Plan</text>
    <text x="240" y="184" fill="#8a909c">Try <tspan fill="#a78bfa">/help</tspan> for commands, <tspan fill="#a78bfa">/config</tspan> to adjust settings.</text>
  </g>

  <!-- Action Rule / Input Zone Boundary -->
  <line x1="40" y1="220" x2="920" y2="220" stroke="#1e222a" stroke-width="1"/>

  <!-- User Input Region Mockup -->
  <text x="40" y="260" font-family="monospace" font-size="15" font-weight="700" fill="#3fb950">act</text>
  <text x="80" y="260" font-family="monospace" font-size="15" font-weight="700" fill="#a78bfa">&gt;</text>
  <rect x="100" y="246" width="8" height="18" rx="1" fill="#c4c9d4"/>
</svg>