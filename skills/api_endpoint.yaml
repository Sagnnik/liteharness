name: api_endpoint
description: Create REST API endpoints with validation and error handling.
triggers:
  - api
  - endpoint
  - route
  - handler
  - controller
  - server
  - backend
constraints:
  - Use Zod or similar for input validation
  - Return consistent error shapes { error: string, code: string }
  - Include proper HTTP status codes
  - Add TypeScript types if project uses them
  - Handle async errors with try/catch
workflow:
  - Check existing route structure (pages/api/, app/api/, src/routes/)
  - Read adjacent endpoints to match patterns
  - Write the handler with validation
  - Update any route index or manifest
  - Add basic error handling for 400, 404, 500
examples:
  - name: Express Handler
