name: react_component
description: Create React components with TypeScript, following project conventions.
triggers:
  - react
  - component
  - tsx
  - jsx
  - ui
  - page
  - widget
  - frontend
constraints:
  - Use functional components with hooks
  - Place in src/components/ for reusable, src/app/ for pages
  - Export default for pages, named export for reusable components
  - Include TypeScript interfaces for all props
  - Use Tailwind CSS classes for styling unless user specifies otherwise
  - Add 'use client' directive for client components in Next.js App Router
workflow:
  - Check if src/components/ exists; create if not
  - Read 1-2 existing components to infer naming conventions
  - Write the .tsx file with proper exports and types
  - If page component, update routing or App.tsx
  - Run tests if available
examples:
  - name: Button
    code: |
      interface ButtonProps {
        label: string;
        onClick: () => void;
        variant?: 'primary' | 'secondary';
      }

      export const Button = ({ label, onClick, variant = 'primary' }: ButtonProps) => (
        <button
          onClick={onClick}
          className={`px-4 py-2 rounded font-medium ${
            variant === 'primary'
              ? 'bg-blue-500 text-white hover:bg-blue-600'
              : 'bg-gray-200 text-gray-800 hover:bg-gray-300'
          }`}
        >
          {label}
        </button>
      );